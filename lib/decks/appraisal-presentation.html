<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Market Appraisal - The Letting Experts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: a full-screen 16:9 stage on white. Two slides split with a grey panel (the cover and the figure);
   the rest change rhythm: centred, side by side, a full-width header row, staggered cards. Cards are TLE OS greys
   on white, white on grey. A real-looking iPhone carries the cover and the contact slide. A thin progress rail runs down the left edge.
   Single light look by choice. On a phone held upright the slides stack into one scrolling page. */
:root {
  --paper: #ffffff; --taupe: #f6f6f5; --grey: #f6f6f5; --card: #ffffff; --card-2: #f6f6f5; --well: #f0f0ee;
  --ink: #141413; --muted: #63625b; --faint: #8f8e87; --line: rgba(20, 20, 19, .12); --line-2: rgba(20, 20, 19, .22);
  --coral: #eb8c6d; --clay: #aa4a2b; --sage: #66785b; --sage-soft: #e3e3d3; --forest: #2e3829; --manilla: #f5e3c7; --gold: #e9c46a;
  --f-title: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --u: min(1vw, 1.7778vh);
  --pad: calc(var(--u) * 6.6);
  --fs-title: calc(var(--u) * 5); --fs-hero: calc(var(--u) * 6.2); --fs-lead: calc(var(--u) * 1.2); --fs-body: calc(var(--u) * 1.02); --fs-small: calc(var(--u) * .86);
  --r: calc(var(--u) * 2); --r-sm: calc(var(--u) * 1.3);
  color-scheme: light;
}
html, body { height: 100%; }
body { margin: 0; background: #e9e9e6; color: var(--ink); font-family: var(--f-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }

/* ---------- stage ---------- */
.deck { position: fixed; inset: 0; display: grid; place-items: center; }
.stage { position: relative; width: calc(var(--u) * 100); height: calc(var(--u) * 56.25); background: var(--paper); overflow: hidden; }
.slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: calc(var(--u) * 9.5) var(--pad) calc(var(--u) * 7.4) calc(var(--pad) + var(--u) * 1); visibility: hidden; opacity: 0; transition: opacity .6s var(--ease), visibility 0s .7s; }
.slide.split { display: grid; grid-template-columns: 54% 46%; padding: 0; }
.slide.is-on { visibility: visible; opacity: 1; transition: opacity .7s var(--ease) .08s, visibility 0s; }
.L { position: relative; display: flex; flex-direction: column; justify-content: center; padding: calc(var(--u) * 8) calc(var(--u) * 5) calc(var(--u) * 7.4) calc(var(--pad) + var(--u) * 1); min-width: 0; }
.R { position: relative; background: var(--taupe); display: flex; align-items: center; justify-content: center; padding: calc(var(--u) * 6) calc(var(--u) * 4.4); min-width: 0; }
.slide .in { opacity: 0; transform: translateY(calc(var(--u) * 1.4)); filter: blur(4px); }
.slide.is-on .in { animation: rise 1s var(--ease) both; animation-delay: calc(.18s + var(--i, 0) * .075s); }
.slide .R .in { transform: translateY(calc(var(--u) * 2.2)) scale(.985); }
@keyframes rise { to { opacity: 1; transform: none; filter: none; } }

/* frame: brand top left, a note top right, page at the foot, the rail down the left */
.brand { position: absolute; top: calc(var(--u) * 3.2); left: calc(var(--pad) + var(--u) * 1); display: flex; align-items: center; gap: calc(var(--u) * .9); font-size: calc(var(--u) * 1); font-weight: 500; z-index: 3; }
.brand img { height: calc(var(--u) * 1.5); width: auto; display: block; }
.bar [hidden] { display: none !important; }
/* TLE OS (23 Oct 2026): the agent's headshot wherever the design drew initials, photographs over the drawn houses */
.av.ph, .tabbar .me.ph { overflow: hidden; padding: 0; } .av.ph img, .tabbar .me.ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; }
.av.xs { width: calc(var(--u) * 2.6); height: calc(var(--u) * 2.6); border-radius: 50%; font-size: calc(var(--u) * .8); }
.pic .pic-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.a-hero.fig .a-chip { top: auto; bottom: calc(var(--u) * .8); max-width: calc(100% - var(--u) * 1.6); }
.a-chip { max-width: 55%; } .a-chip svg { flex: none; } .a-chip .tx { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.a-list .copyable .tx { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.agent-card2 .reach2 { grid-template-columns: auto minmax(0, 1fr); column-gap: calc(var(--u) * 3); }
.agent-card2 .rv { font-size: var(--fs-body); overflow-wrap: anywhere; } .agent-card2 .rv a { color: inherit; text-decoration: none; }
.who-pills { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .5); align-items: center; } .who-pills .pill { white-space: normal; }
.mside .val.xl { font-size: calc(var(--u) * 3.2); }
/* Three cards beside the chart (the builder's four defaults): tighter, so the slide keeps its clear space at the top. */
.mside.three { gap: calc(var(--u) * .8); } .mside.three .ui { padding: calc(var(--u) * 1.1) calc(var(--u) * 1.4); } .mside.three .val.xl { font-size: calc(var(--u) * 2.4); } .mside.three .lab { font-size: calc(var(--u) * .95); }
.market-s .mgrid { margin-top: calc(var(--u) * 2.4); }
.market-s .mgrid:has(.mside.three) { margin-top: calc(var(--u) * 1.6); }
.chart .bbar { fill: var(--ink); transform-box: fill-box; transform-origin: 50% 100%; } .chart .bbar.mine { fill: var(--coral); }
.slide.is-on .chart .bbar { animation: barup 1.2s var(--ease) .5s both; } @keyframes barup { from { transform: scaleY(0); } }
.chart .barv { fill: var(--ink); font-family: var(--f-ui); font-size: 14px; font-weight: 500; } .chart .barl { fill: var(--muted); font-family: var(--f-ui); font-size: 12px; } .chart .barn { fill: var(--faint); font-family: var(--f-mono); font-size: 10.5px; }
.stackbar { display: flex; gap: 2px; height: calc(var(--u) * .7); border-radius: 999px; overflow: hidden; margin: calc(var(--u) * .6) 0 calc(var(--u) * .2); } .stackbar i { display: block; height: 100%; }
a.btn { text-decoration: none; color: inherit; } a.btn.dark { color: var(--ink); }
.cta-say { margin: calc(var(--u) * 1.4) 0 0; max-width: 34em; min-height: 1.4em; } .cta-say.err { color: var(--clay); } .cta-say a { color: var(--clay); }
.sample-tag { font-family: var(--f-mono); font-size: 11px; color: var(--clay); background: var(--manilla); border-radius: 999px; padding: 4px 10px; }
@media (max-width: 700px) { .brand img { height: 18px; } .btns { flex-wrap: wrap; } .btn { white-space: nowrap; } .rules-head { flex-wrap: wrap; } }
.note { position: absolute; top: calc(var(--u) * 3); right: var(--pad); display: flex; align-items: center; gap: calc(var(--u) * .9); font-size: var(--fs-small); color: var(--muted); line-height: 1.35; z-index: 3; text-align: left; }
.note b { color: var(--ink); font-weight: 600; }
.note .x { width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; flex: none; }
.note .x svg { width: 60%; height: 60%; }
.pg { position: absolute; bottom: calc(var(--u) * 3); left: calc(var(--pad) + var(--u) * 1); font-family: var(--f-mono); font-size: var(--fs-small); color: var(--faint); z-index: 3; }
.pg b { color: var(--ink); font-weight: 400; }
.rail { position: absolute; left: calc(var(--u) * 3); top: calc(var(--u) * 9); bottom: calc(var(--u) * 9); width: 1px; background: var(--line); z-index: 4; pointer-events: none; }
.rail i { position: absolute; left: 50%; width: calc(var(--u) * 1.5); height: calc(var(--u) * 1.5); margin: calc(var(--u) * -.75) 0 0 calc(var(--u) * -.75); border-radius: 50%; border: 1px solid var(--line-2); background: var(--paper); display: grid; place-items: center; transition: top .9s var(--ease); }
.rail i::after { content: ""; width: 34%; height: 34%; border-radius: 50%; background: var(--coral); }
.rail .fill { position: absolute; left: 0; width: 1px; top: 0; background: var(--ink); transition: height .9s var(--ease); }

/* ---------- type ---------- */
.eyebrow { font-size: calc(var(--u) * 1.15); color: var(--ink); margin: 0 0 calc(var(--u) * 1.4); }
.eyebrow sup, .title sup, .val sup { font-size: .42em; vertical-align: top; position: relative; top: .35em; margin-left: .15em; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.title { font-family: var(--f-title); font-weight: 300; font-size: var(--fs-title); line-height: 1.02; letter-spacing: -.035em; margin: 0; text-wrap: balance; }
.title.hero { font-size: var(--fs-hero); }
.title .soft { color: var(--faint); }
.slide:not(.split) .title { font-size: calc(var(--u) * 4.4); }
.lead { font-size: var(--fs-lead); line-height: 1.6; color: var(--muted); margin: calc(var(--u) * 2) 0 0; max-width: 36em; }
.small { font-size: var(--fs-small); color: var(--muted); line-height: 1.45; }
.num { font-variant-numeric: tabular-nums; }

/* the ruled list */
.rl { list-style: none; margin: calc(var(--u) * 3.4) 0 0; padding: 0 0 0 calc(var(--u) * 3); border-left: 1px solid var(--line-2); display: flex; flex-direction: column; gap: calc(var(--u) * 2); max-width: calc(var(--u) * 40); }
.rl li h4 { margin: 0 0 calc(var(--u) * .6); font-family: var(--f-title); font-weight: 400; font-size: calc(var(--u) * 1.6); letter-spacing: -.02em; }
.rl li p { margin: 0; font-size: var(--fs-body); line-height: 1.65; color: var(--muted); }
.rl li.fade { opacity: .42; }
.rl.go li { cursor: pointer; transition: opacity .3s, transform .4s var(--ease); }
.rl.go li:hover { opacity: 1; transform: translateX(calc(var(--u) * .4)); }

/* buttons */
.btns { display: flex; gap: calc(var(--u) * .8); margin-top: calc(var(--u) * 4.2); }
.btn { display: inline-flex; align-items: center; gap: calc(var(--u) * 1); border-radius: calc(var(--u) * 1.7); padding: calc(var(--u) * 1.7) calc(var(--u) * 2.8); font-size: calc(var(--u) * 1.15); font-weight: 400; cursor: pointer; border: 1px solid var(--line-2); background: transparent; transition: background .3s var(--ease), gap .35s var(--ease), border-color .3s, color .3s; }
.btn.dark { background: var(--coral); color: var(--ink); border-color: var(--coral); font-weight: 500; }
.btn.dark:hover { gap: calc(var(--u) * 1.6); background: var(--clay); border-color: var(--clay); color: #fff; }
.btn:not(.dark):hover { border-color: var(--sage); background: var(--sage); color: #fff; }
.btn svg, .btn .ic { width: calc(var(--u) * 1.4); height: calc(var(--u) * 1.4); color: inherit; }
.arrow .ic, .phone .ic { color: inherit; }

/* ---------- floating cards ---------- */
.ui { background: var(--grey); border-radius: var(--r); padding: calc(var(--u) * 1.6) calc(var(--u) * 1.8); display: flex; flex-direction: column; gap: calc(var(--u) * .5); min-width: 0; }
.ui.soft { background: var(--card-2); } .ui.well { background: var(--well); } .ui.dark { background: var(--ink); color: #fff; } .ui.forest { background: var(--forest); color: #faf9f5; }
.ui.man { background: var(--manilla); } .ui.sage { background: var(--sage-soft); } .ui.coral { background: var(--coral); } .ui.coral .lab { color: rgba(20, 20, 19, .72); }
/* who we are: the figures and the two promises run the full height of the words beside them */
.cols.who-cols { align-items: stretch; } .who-wrap { position: relative; } .who-b { position: absolute; inset: 0; } .who-b .ui { justify-content: space-between; overflow: hidden; }
.who-b .ui .row { align-items: center; } .who-b .val.xl { margin-top: 0 !important; font-size: calc(var(--u) * 3.6); }
.who-say { font-family: var(--f-title); font-weight: 400; font-size: calc(var(--u) * 1.9); letter-spacing: -.02em; line-height: 1.1; }
@media (max-aspect-ratio: 4/5), (max-width: 700px) { .who-b { position: static; grid-template-rows: none !important; } .who-b .ui .row { flex-wrap: wrap; } }
.lab { font-size: var(--fs-small); color: var(--muted); line-height: 1.35; }
.ui.dark .lab, .ui.forest .lab { color: rgba(250, 249, 245, .62); }
.val { font-family: var(--f-title); font-weight: 300; font-size: calc(var(--u) * 3); line-height: 1; letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.val.xl { font-size: calc(var(--u) * 4.4); }
.ui .row { display: flex; justify-content: space-between; align-items: flex-start; gap: calc(var(--u) * 1); }
.ic { width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); color: inherit; flex: none; }
.ui.dark .ic, .ui.forest .ic { color: #faf9f5; }
.badge { width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); border-radius: calc(var(--u) * .35); background: var(--gold); display: grid; place-items: center; }
.badge::after { content: ""; width: 34%; height: 34%; border-radius: 50%; background: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: calc(var(--u) * .5); font-size: var(--fs-small); padding: calc(var(--u) * .45) calc(var(--u) * 1); border-radius: 999px; background: var(--well); white-space: nowrap; }
.pill.on { background: var(--ink); color: #fff; } .pill.sage { background: var(--sage-soft); color: #4d5e43; }
.toggle { width: calc(var(--u) * 2.8); height: calc(var(--u) * 1.6); border-radius: 999px; background: var(--ink); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 15%; right: 8%; height: 70%; aspect-ratio: 1; border-radius: 50%; background: #fff; }
.toggle.off { background: var(--well); } .toggle.off::after { right: auto; left: 8%; }
.dots { display: flex; gap: calc(var(--u) * .35); justify-content: center; }
.dots i { width: calc(var(--u) * .45); height: calc(var(--u) * .45); border-radius: 50%; background: var(--line-2); } .dots i.on { background: var(--ink); }

/* the house picture used where a photo would go */
.pic { position: relative; border-radius: var(--r-sm); overflow: hidden; background: linear-gradient(160deg, #3b4735 0%, var(--forest) 70%); }
.pic svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.pic .sun { fill: var(--coral); } .pic .ln { fill: none; stroke: #faf9f5; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
.pic .win { fill: var(--manilla); opacity: .85; } .pic .door { fill: var(--coral); } .pic .body { fill: var(--forest); }
.pic .grain { position: absolute; inset: 0; opacity: .12; mix-blend-mode: soft-light; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.slide.is-on .pic .ln { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 2.4s var(--ease) .5s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* ---------- 1 cover: the plan, as a phone screen ---------- */
.phone { width: calc(var(--u) * 24); height: calc(var(--u) * 46); background: var(--card); border-radius: calc(var(--u) * 3.2); padding: calc(var(--u) * 2.2) calc(var(--u) * 1); display: flex; flex-direction: column; gap: calc(var(--u) * .8); }
.phone .top { display: flex; justify-content: space-between; align-items: center; padding: 0 calc(var(--u) * 1.2); }
.phone .top svg { width: calc(var(--u) * 1.6); height: calc(var(--u) * 1.6); }
.phone .hi { font-family: var(--f-title); font-weight: 300; font-size: calc(var(--u) * 1.8); line-height: 1.15; letter-spacing: -.03em; padding: calc(var(--u) * .8) calc(var(--u) * 1.2) calc(var(--u) * .2); }
.phone > .pic { min-height: calc(var(--u) * 8); }
.phone .hi span { color: var(--faint); }
.phone .ui { border-radius: calc(var(--u) * 1.4); padding: calc(var(--u) * 1.2); }
.phone .t2 { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * .6); }
.phone .pic { flex: 1; border-radius: calc(var(--u) * 1.4); }
.phone .nav { display: flex; justify-content: space-around; align-items: center; padding-top: calc(var(--u) * .6); }
.phone .nav span { width: calc(var(--u) * 2.8); height: calc(var(--u) * 2.8); border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.phone .nav span.on { background: var(--well); color: var(--ink); }
.phone .nav svg { width: 46%; height: 46%; }
.phone .nav .me { background: var(--sage-soft); color: #4d5e43; font-size: calc(var(--u) * .8); font-weight: 600; }

/* bento layouts on the right */
.bento { display: grid; gap: calc(var(--u) * 1); width: 100%; }
.b2 { grid-template-columns: 1fr 1fr; }
.span2 { grid-column: span 2; }
.agent-card { width: 100%; display: flex; flex-direction: column; gap: calc(var(--u) * 1); }
.av { width: calc(var(--u) * 6); height: calc(var(--u) * 6); border-radius: calc(var(--u) * 1.6); background: var(--sage-soft); color: #4d5e43; display: grid; place-items: center; font-family: var(--f-title); font-size: calc(var(--u) * 2); font-weight: 400; flex: none; }
.av.sm { width: calc(var(--u) * 4); height: calc(var(--u) * 4); border-radius: 50%; font-size: calc(var(--u) * 1.3); }
.ring { width: calc(var(--u) * 9); height: calc(var(--u) * 9); }
.ring circle { fill: none; stroke-width: 6; } .ring .bg { stroke: var(--well); } .ring .fg { stroke: var(--sage); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.slide.is-on .ring .fg { animation: ring 1.6s var(--ease) .6s both; }
@keyframes ring { from { stroke-dashoffset: var(--len); } }
.stars { display: flex; gap: 2px; } .stars i { width: calc(var(--u) * .9); height: calc(var(--u) * .9); background: var(--gold); clip-path: polygon(50% 0, 62% 35%, 100% 38%, 70% 60%, 80% 100%, 50% 77%, 20% 100%, 30% 60%, 0 38%, 38% 35%); }
.chk { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: calc(var(--u) * .9); }
.chk li { display: flex; gap: calc(var(--u) * .8); font-size: var(--fs-body); line-height: 1.5; }
.chk li::before { content: ""; width: calc(var(--u) * .55); height: calc(var(--u) * .55); border-radius: 50%; background: var(--clay); margin-top: calc(var(--u) * .62); flex: none; }
.chk small { display: block; color: var(--muted); font-size: var(--fs-small); }

/* chart */
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--line); }
.chart .axis text { fill: var(--faint); font-family: var(--f-mono); font-size: 12px; }
.chart .lineP { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1200; stroke-dashoffset: 1200; }
.slide.is-on .chart .lineP { animation: draw 2s var(--ease) .55s forwards; }
.chart .endpt { fill: var(--coral); } .chart .endlab { fill: var(--ink); font-family: var(--f-ui); font-size: 14px; font-weight: 500; }

/* gauge for the figure */
.gauge > svg { width: 100%; height: auto; overflow: visible; }
.gauge .tk { stroke: var(--faint); stroke-width: 1.2; } .gauge .tk.in { stroke: var(--ink); stroke-width: 1.6; }
.gauge text { font-family: var(--f-ui); font-size: 12px; fill: var(--muted); }
.gauge .needle { stroke: var(--coral); stroke-width: 2.4; stroke-linecap: round; transform-origin: 150px 150px; }
.slide.is-on .gauge .needle { animation: needle 1.6s var(--ease) .6s both; }
@keyframes needle { from { transform: rotate(-80deg); } }
.gauge .hub { fill: var(--coral); }

/* comparables: offset cards like a carousel */
.comps { display: grid; grid-template-columns: var(--cc, 1fr 1.25fr 1fr 1fr); gap: calc(var(--u) * 1.4); align-items: center; margin-top: calc(var(--u) * 3.6); }
.comp { display: flex; flex-direction: column; gap: calc(var(--u) * .6); }
.comp:nth-child(odd) { transform: translateY(calc(var(--u) * 2)); }
.comp:nth-child(even) { transform: translateY(calc(var(--u) * -1.4)); }
.comp .pic { height: calc(var(--u) * 7.5); }
.comp.feat .pic { height: calc(var(--u) * 11); }
.comp .meta { display: flex; justify-content: space-between; align-items: flex-end; gap: calc(var(--u) * 1); }
.comp b { font-weight: 500; font-size: var(--fs-body); }
.comp.feat { background: var(--grey); border-radius: var(--r); padding: calc(var(--u) * 1.2); }

    <line class="needle" x1="${cx}" y1="${cy}" x2="${nd[0].toFixed(1)}" y2="${nd[1].toFixed(1)}"/><circle class="hub" cx="${cx}" cy="${cy}" r="6"/></svg>`;
}
if (HAS.figure) {
  n = 0; slide('figure', 'The Figure', `
  <div class="L">
    <p class="eyebrow in" ${i()}>The figure</p>
    <h2 class="title in" ${i()}>We’d advertise at</h2>
    <div class="title in" ${i('font-size:calc(var(--u)*8.4);margin-top:calc(var(--u)*.8)')}>${money(FIG.ask)}<sup>pcm</sup></div>
    <ul class="rl in" ${i()}><li><h4>Priced to move</h4><p>Pitched to bring in plenty of good applicants in the first weeks.${FIG.low !== FIG.high ? ` Our range runs from ${money(FIG.low)} to ${money(FIG.high)}.` : ''}</p></li></ul>
  </div>
  <div class="R">
    <div class="bento b2">
      <div class="ui gauge in" ${i('grid-column:span 2;padding:calc(var(--u)*2)')}><div class="row"><div class="row" style="justify-content:flex-start;align-items:center">${ic('home')}<div><b style="font-weight:500">Our range</b><div class="lab">${esc(A.first)}’s range for your home</div></div></div><span class="pill on">${money(FIG.ask)}</span></div>${gaugeSvg()}</div>
      <div class="ui in" ${i()}><span class="lab">A year’s rent</span><span class="val">${money(FIG.ask * 12)}</span></div>
      ${D.scottish ? '' : `<div class="ui in" ${i()}><span class="lab">Deposit<sup> 5 weeks</sup></span><span class="val">${money(deposit)}</span></div>
      <div class="ui in" ${i()}><span class="lab">Holding fee<sup> 1 week</sup></span><span class="val">${money(holding)}</span></div>`}
      <div class="ui dark in" ${i()}><span class="lab">Time to let</span><span class="val">${esc(FIG.weeks)}</span></div>
    </div>
  </div>`, { split: true });
}

/* 8 finding the tenant: four steps as a staggered row of TLE OS cards */
n = 0; slide('finding', 'Finding Your Tenant', `
  <div class="hrow in" ${i()}><div><p class="eyebrow">Finding your tenant</p><h2 class="title">Lots of interest, then the right person.</h2></div><p class="lead">From the photos to the right tenant, we do every step, and ${esc(A.first)} keeps you posted.</p></div>
  <div class="steps">
    <div class="ui in" ${i()}><span class="st-n">01 · Day 3</span>${ic('camera')}<b>Photos and floor plan</b><span class="lab">A professional photographer, at a time that suits you.</span><div class="st-foot pills"><span class="pill w">Photos</span><span class="pill w">Floor plan</span></div></div>
    <div class="ui in" ${i()}><span class="st-n">02 · Day 4</span>${ic('screen')}<b>Live on the portals</b><span class="lab">Your advert goes up everywhere tenants look.</span><div class="st-foot pills"><span class="pill on">Rightmove</span><span class="pill on">Zoopla</span><span class="pill on">OnTheMarket</span></div></div>
    <div class="ui in" ${i()}><span class="st-n">03 · Week 1</span><div class="row">${ic('pass')}<span class="badge"></span></div><b>A tenant passport each</b><span class="lab">Every applicant fills in a tenant passport, so you see who they are.</span><div class="st-foot"><span class="val" style="font-size:calc(var(--u)*2.2)">Done</span><span class="toggle"></span></div></div>
    <div class="ui dark in" ${i()}><span class="st-n">04 · Week 1 to 2</span>${ic('key')}<b>We show every viewing</b><span class="lab">You don’t need to be there. Feedback the same day.</span><div class="st-foot"><span class="val" style="font-size:calc(var(--u)*2.2)">Booked</span></div></div>
  </div>
  <div class="checkrow in" ${i()}><span class="lab">Before anyone moves in</span>${['Full references', RTR && 'Right to rent', 'Affordability', 'Pre-let checks by our compliance team', 'Deposit protected'].filter(Boolean).map(c => `<span class="pill">${c}</span>`).join('')}</div>`);

/* 9 services: the deck's own fee schedule */
if (HAS.fees) {
  const S = D.services;
  n = 0; slide('fees', 'Choose Your Service', `
  <div class="hrow in" ${i()}><div><p class="eyebrow">Your service</p><h2 class="title">Choose how much you’d like us to do.</h2></div>${D.feesNote ? `<p class="lead">${esc(D.feesNote)}</p>` : ''}</div>
  <div class="svcs" style="--sc:${S.length}">${S.map(s => `<div class="svc${s.id === D.recommended ? ' pick' : ''} in" ${i()}>
    <span class="tagline">${s.id === D.recommended ? 'What we’d suggest for this home' : '&nbsp;'}</span>
    <h3>${esc(s.name)}</h3><span class="val">${esc(s.price)}</span><span class="lab">${[esc(s.unit), esc(s.note || s.blurb)].filter(Boolean).join(' · ')}</span>
    ${s.feats.length ? `<ul class="feats">${D.featNames.map((f, j) => `<li class="${s.feats[j] ? '' : 'no'}">${esc(f)}</li>`).join('')}</ul>` : ''}</div>`).join('')}</div>`);
}

/* 10 compliance: centred, one wide card of switches */
const managed = D.services.find(s => s.id === 'managed');
const rules = [['Gas safety check', 'Every year, by a Gas Safe engineer'], ['Electrical safety (EICR)', 'At least every five years'], ['Energy rating (EPC)', D.scottish ? 'A current certificate before it’s let' : 'Band E or better to let'], ['Smoke and CO alarms', 'Tested on move-in day'], ['Deposit protection', 'Registered with a government scheme'], RTR && ['Right to rent', 'Checked for every adult'], RTR && ['How to Rent guide', 'The current version, given at signing'], ['Law changes', 'We update your paperwork when rules change']].filter(Boolean);
n = 0; slide('rules', 'Staying Compliant', `
  <div class="center">
    <p class="eyebrow in" ${i()}>Staying compliant</p>
    <h2 class="title in" ${i()}>The rules are long. <span class="soft">We keep track.</span></h2>
  </div>
  <div class="ui in" ${i('margin-top:calc(var(--u)*3.4);padding:calc(var(--u)*1.4) calc(var(--u)*2.6)')}>
    <div class="row rules-head" style="align-items:center;padding:calc(var(--u)*.8) 0 calc(var(--u)*1.2)"><b style="font-weight:400;font-family:var(--f-title);font-size:calc(var(--u)*1.7);letter-spacing:-.02em">Compliance<sup class="small"> ${rules.length} checks</sup></b><span class="lab">On ${esc(managed ? managed.name : 'full management')} we book, renew and remind you, before anything runs out.</span><span class="pill sage">All handled</span></div>
    <div class="rules2">${rules.map(r => `<div class="row" style="align-items:center"><div><b style="font-weight:500;font-size:var(--fs-body)">${r[0]}</b><div class="lab">${r[1]}</div></div><span class="toggle"></span></div>`).join('')}</div>
  </div>`);

/* 11 timeline: a soft line that flows through the six stops */
const TLY = [58, 30, 56, 26, 64, 42];
const TLX = D.timeline.map((_, k) => 6 + k * 17.6);
function flowPath() {
  const pts = [[-2, TLY[0] + 6]].concat(TLX.map((x, k) => [x, TLY[k]])).concat([[102, TLY[TLY.length - 1] - 8]]).map(p => [p[0] * 10, p[1]]);
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let k = 0; k < pts.length - 1; k++) { const p0 = pts[k - 1] || pts[k], p1 = pts[k], p2 = pts[k + 1], p3 = pts[k + 2] || p2;
    d += ` C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)},${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)} ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)},${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)} ${p2[0]},${p2[1]}`; }
  return d;
}
n = 0; slide('plan', 'From Today to Move-in', `
  <div class="hrow in" ${i()}><div><p class="eyebrow">The plan</p><h2 class="title">From today to your tenant moving in.</h2></div><p class="lead">Sign this week, and a tenant could be in by ${esc(D.moveIn)}.</p></div>
  <div class="flow">
    <svg class="flow-line" viewBox="0 0 1000 100" preserveAspectRatio="none" aria-hidden="true"><path class="fl-bg" d="${flowPath()}" vector-effect="non-scaling-stroke"/><clipPath id="flClip"><rect class="fl-clip" x="-30" y="-100" width="1060" height="300"/></clipPath><path class="fl-fg" d="${flowPath()}" clip-path="url(#flClip)" vector-effect="non-scaling-stroke"/></svg>
    ${D.timeline.map((t, k) => `<div class="stop ${TLY[k] > 45 && k !== D.timeline.length - 1 ? 'down' : 'up'}${k === 0 ? ' first' : ''}${k === D.timeline.length - 1 ? ' last' : ''}" style="left:${TLX[k]}%;top:${TLY[k]}%;--d:${(1.6 + 3 * (TLX[k] * 10 + 30) / 1060).toFixed(2)}s"><i></i><div class="stop-card"><span class="when">${esc(t[0])}</span><h4>${esc(t[1])}</h4><span class="lab">${esc(t[2])}</span></div></div>`).join('')}
  </div>`);

/* 12 next steps: words left, the phone right. Staff presenting send the terms from here; anyone else gets the agent's contact. */
const tel = A.phone ? A.phone.replace(/\s+/g, '') : '';
const ctaBtns = D.cta
  ? `<button class="btn dark" id="ctaBtn">Let’s get it on the market ${arrowR}</button><button class="btn" data-go="0">Start again</button>`
  : `${tel ? `<a class="btn dark" href="tel:${esc(tel)}">${ic('phone', '')}<span>Call ${esc(A.first)}</span></a>` : ''}${A.email ? `<a class="btn${tel ? '' : ' dark'}" href="mailto:${esc(A.email)}">${ic('mail', '')}<span>Email ${esc(A.first)}</span></a>` : ''}<button class="btn" data-go="0">Start again</button>`;
n = 0; slide('next', 'Next Steps', `
  <div class="cols" style="grid-template-columns:1.2fr 1fr">
    <div>
      <p class="eyebrow in" ${i()}>Next steps</p>
      <h2 class="title in" ${i()}>Ready when you are${L.first ? ', ' + esc(L.first) : ''}.</h2>
      <ul class="rl in" ${i()}>
        <li><h4>Sign the Terms of Business</h4><p>We email them to you, and you can sign them on your phone.</p></li>
        <li><h4>Send your ID and proof of ownership</h4><p>A passport or driving licence, and a mortgage statement or the title.</p></li>
        <li class="fade"><h4>Pick a time for the photos</h4><p>Our photographer comes at a time that suits you.</p></li>
      </ul>
      <div class="btns in" ${i()}>${ctaBtns}</div>
      ${D.cta ? `<p class="lab cta-say" id="ctaSay" role="status"></p>` : ''}
    </div>
    <div class="in" ${i('display:flex;justify-content:center')}>${iphone(`
      <div class="a-head"><span class="a-brand">${ic('home', '')}<b>Your expert</b></span><span class="a-bell">${ic('bell', '')}<i></i></span></div>
      <div class="a-contact">${face('')}<b>${esc(A.name)}</b><span class="sub">${esc(A.role)}, The Letting Experts</span>
        <div class="a-acts"><span>${ic('phone', '')}<i>Call</i></span><span>${ic('chat', '')}<i>Message</i></span><span>${ic('mail', '')}<i>Email</i></span></div></div>
      ${A.phone || A.email ? `<div class="a-list">${A.phone ? `<span class="copyable"><span><i>Mobile</i><span class="tx">${esc(A.phone)}</span></span><button data-copy="${esc(A.phone)}">Copy</button></span>` : ''}${A.email ? `<span class="copyable"><span><i>Email</i><span class="tx">${esc(A.email)}</span></span><button data-copy="${esc(A.email)}">Copy</button></span>` : ''}</div>` : ''}
      <div class="a-row"><div><span>Terms of Business</span><b>To sign</b></div><span class="pill on">Sign</span></div>`, TABS, 3)}</div>
  </div>`);

/* ---------- render ---------- */
const stage = document.getElementById('stage');
const tot = String(SLIDES.length).padStart(2, '0');
stage.innerHTML = SLIDES.map((s, k) => `<section class="slide${s.split ? ' split' : ''}${s.cls ? ' ' + s.cls : ''}" id="s${k + 1}" aria-label="${k + 1} of ${SLIDES.length}: ${esc(s.title)}"${k ? ' aria-hidden="true"' : ''}>
  <div class="brand"><img src="/brand/tle-logo-line.png" alt="The Letting Experts"></div>
  ${s.html}
  <div class="pg"><b>${String(k + 1).padStart(2, '0')}</b> / ${tot} · ${esc(P.street)}</div>
</section>`).join('') + '<div class="rail" aria-hidden="true"><span class="fill"></span><i></i></div>';
const els = [...stage.querySelectorAll('.slide')];
document.getElementById('ovGrid').innerHTML = SLIDES.map((s, k) => `<button class="ov-card${s.split ? ' split' : ''}" style="--i:${k}" data-k="${k}"><span>${String(k + 1).padStart(2, '0')}</span><b>${esc(s.title)}</b></button>`).join('');
const rail = stage.querySelector('.rail'), dot = rail.querySelector('i'), rfill = rail.querySelector('.fill');
if (D.sample) { const t = document.createElement('span'); t.className = 'sample-tag'; t.textContent = 'Sample'; const bi = document.querySelector('.bar-in'); bi.insertBefore(t, bi.firstChild); }

const stacked = () => matchMedia('(max-aspect-ratio: 4/5), (max-width: 700px)').matches;
let cur = 0;
function go(k, instant) {
  k = Math.max(0, Math.min(SLIDES.length - 1, k));
  if (stacked()) els[k].scrollIntoView({ behavior: instant ? 'auto' : 'smooth', block: 'start' });
  els.forEach((el, j) => { el.classList.toggle('is-on', j === k); el.setAttribute('aria-hidden', j === k ? 'false' : 'true'); });
  cur = k;
  const pc = (k / (SLIDES.length - 1) * 100) + '%'; dot.style.top = pc; rfill.style.height = pc;
  document.getElementById('count').textContent = (k + 1) + ' / ' + SLIDES.length;
  document.getElementById('prev').disabled = k === 0; document.getElementById('next').disabled = k === SLIDES.length - 1;
  try { history.replaceState(null, '', '#s' + (k + 1)); } catch (e) {}
}
const start = /^#s(\d+)$/.exec(location.hash); go(start ? +start[1] - 1 : Math.min(D.startAt || 0, SLIDES.length - 1), true);
/* The builder's live preview moves the deck: postMessage({ go: n }). */
window.addEventListener('message', e => { if (e.data && Number.isInteger(e.data.go)) go(Math.max(0, Math.min(e.data.go, SLIDES.length - 1)), true); });
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
const ov = document.getElementById('ov');
function overview(open) { ov.classList.toggle('open', open); if (open) [...ov.querySelectorAll('.ov-card')].forEach((c, j) => c.classList.toggle('on', j === cur)); }

stage.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) go(+g.dataset.go);
  if (e.target.closest('[data-ov]')) overview(true);
  const c = e.target.closest('[data-copy]'); if (c) { const txt = c.dataset.copy; try { navigator.clipboard.writeText(txt).then(() => { c.textContent = 'Copied'; }, () => { c.textContent = txt; }); } catch (x) { c.textContent = txt; } }
});
document.getElementById('ovBtn').onclick = () => overview(true);
document.getElementById('ovClose').onclick = () => overview(false);
ov.onclick = e => { const c = e.target.closest('.ov-card'); if (c) { overview(false); go(+c.dataset.k); } else if (e.target === ov) overview(false); };
document.addEventListener('keydown', e => {
  const k = e.key;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (k === 'ArrowRight' || k === 'PageDown' || (k === ' ' && !stacked())) { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); go(cur - 1); }
  else if (k === 'Home') go(0); else if (k === 'End') go(SLIDES.length - 1);
  else if (k === 'g' || k === 'G') overview(!ov.classList.contains('open'));
  else if (k === 'Escape') overview(false);
});
let tx = null; stage.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
stage.addEventListener('touchend', e => { if (tx === null || stacked()) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) go(cur + (d < 0 ? 1 : -1)); tx = null; });
let idleT; function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!ov.classList.contains('open') && !stacked()) document.body.classList.add('idle'); }, 2800); }
['mousemove', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, wake, { passive: true })); wake();
const io = new IntersectionObserver(es => { if (!stacked()) return; es.forEach(en => { if (en.isIntersecting) { cur = els.indexOf(en.target); document.getElementById('count').textContent = (cur + 1) + ' / ' + SLIDES.length; } }); }, { threshold: .5 });
els.forEach(el => io.observe(el));

/* a photograph that won't load: the drawn house stays; a headshot falls back to initials */
stage.querySelectorAll('img[data-drop]').forEach(img => img.addEventListener('error', () => img.remove()));
stage.querySelectorAll('img[data-face]').forEach(img => img.addEventListener('error', () => { const p = img.parentElement; if (!p) return; p.classList.remove('ph'); p.textContent = A.initials; }));

/* "Let's get it on the market": the Terms of Business, the same way the appraisal page sends them.
   Read first (who has signed, who has been sent it); then either open the terms to prepare and sign,
   or ask once more before emailing them. Nothing is sent on the first press. */
(function () {
  const btn = document.getElementById('ctaBtn'); if (!btn) return;
  const say = document.getElementById('ctaSay');
  const idv = D.cta && D.cta.appraisalId, base = idv ? '/api/appraisals/' + encodeURIComponent(idv) : '';
  const prepUrl = idv ? '/market-appraisals/' + encodeURIComponent(idv) + '/send' : '';
  const label = t => { btn.innerHTML = t + ' ' + arrowR; };
  const tell = (h, err) => { say.innerHTML = h; say.classList.toggle('err', Boolean(err)); };
  const day = iso => { try { return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', timeZone: 'Europe/London' }); } catch (x) { return ''; } };
  const openLink = t => `<a href="${esc(prepUrl)}" target="_blank" rel="noopener">${t}</a>`;
  let st = null, armed = false, busy = false;
  const read = () => fetch(base + '/terms', { cache: 'no-store', credentials: 'same-origin' }).then(r => r.json()).catch(() => ({ ok: false, error: 'Couldn’t read the terms just now.' }));
  const ready = idv && !D.sample ? read().then(j => { st = j; return j; }) : Promise.resolve(null);
  function decide() {
    if (!st || st.ok === false) { tell(esc((st && st.error) || 'Couldn’t read the terms just now.') + ' ' + openLink('Open the terms'), true); return; }
    const ps = st.parties || [], ll = ps.find(p => p.role === 'landlord'), ag = ps.find(p => p.role === 'agent');
    if (ll && ll.completedAt) { label('Signed'); tell(`${esc(ll.name || L.full || 'They')} signed the terms on ${day(ll.completedAt)}.`); return; }
    if (ll && ll.sentAt) { tell(`The terms went to ${esc(ll.email)} on ${day(ll.sentAt)}, and are waiting to be signed. ${openLink('Open the contract')}`); return; }
    if (!st.connected || !ll || !ag || !ag.completedAt) {
      const w = window.open(prepUrl, '_blank', 'noopener');
      tell(w ? 'The terms are open in a new tab: check them, sign your half, then send them from there.' : `The terms need preparing and your signature first. ${openLink('Open the terms')}`);
      return;
    }
    if (st.sendUnlocked === false) { tell('Sending is switched off on this environment, so nothing can go from here.', true); return; }
    armed = true; label('Send the terms to ' + esc(ll.email)); tell(`Press again to email the presentation and the terms to ${esc(ll.email)} now.`);
  }
  function send() {
    busy = true; label('Sending…');
    fetch(base + '/terms', { method: 'POST', credentials: 'same-origin' }).then(r => r.json()).then(j => {
      busy = false; armed = false;
      if (j && j.ok) { label('Sent'); btn.disabled = true; tell(esc(j.message || 'Sent.')); }
      else { label('Let’s get it on the market'); tell(esc((j && j.error) || 'Couldn’t send it just now.'), true); }
    }).catch(() => { busy = false; armed = false; label('Let’s get it on the market'); tell('Couldn’t send it just now. Try again in a moment.', true); });
  }
  btn.onclick = () => {
    if (busy) return;
    if (D.sample) { tell('This is the sample, so nothing is sent. On a real presentation this sends the Terms of Business.'); return; }
    if (!idv) { tell('This presentation isn’t linked to an appraisal, so the terms can’t be sent from here.', true); return; }
    if (armed) { send(); return; }
    if (!st) { tell('Checking the terms…'); ready.then(decide); return; }
    decide();
  };
})();

if (D.token) fetch('/api/present/opened', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token: D.token }), keepalive: true }).catch(() => {});
</script>
