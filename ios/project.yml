name: TLEOS
options:
  bundleIdPrefix: uk.co.thelettingexperts
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  TLEOS:
    type: application
    platform: iOS
    sources:
      - path: TLEOS
    settings:
      base:
        PRODUCT_NAME: TLEOS
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.thelettingexperts.os
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: TLEOS/Info.plist
      properties:
        CFBundleDisplayName: TLE OS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        OSBaseURL: https://tle-os.co.uk
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Light
        UIStatusBarStyle: UIStatusBarStyleDarkContent
        # The root view controller picks light or dark text from the page's theme-color.
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: Take a photo of a tenant's ID for the Right to Rent check.
        NSPhotoLibraryUsageDescription: Choose a photo of a tenant's ID for the Right to Rent check.
        NSLocationWhenInUseUsageDescription: Find homes near where you are standing.
    entitlements:
      path: TLEOS/TLEOS.entitlements
      properties:
        aps-environment: development

schemes:
  TLEOS:
    build:
      targets:
        TLEOS: all
    run:
      config: Debug
      # Tick this in Edit Scheme > Run > Arguments to point a Debug build at a local server.
      environmentVariables:
        - variable: OS_BASE_URL
          value: http://localhost:3000
          isEnabled: false
    archive:
      config: Release
