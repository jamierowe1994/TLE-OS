<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>TLE OS</title>
<style>
  :root { --bg:#f8f7f4; --ink:#141413; --soft:rgba(20,20,19,.62); --line:rgba(20,20,19,.14); --btn:#56423e; --on:#fff; --good:#56634a; --note:#a85a51; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#23201f; --ink:#f1efe9; --soft:rgba(241,239,233,.62); --line:rgba(255,255,255,.14); --btn:#c4a092; --on:#1b1716; --good:#9fb08d; --note:#d6907f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; width:300px; background:var(--bg); color:var(--ink); font:13px/1.45 Inter, "Unitext", Montserrat, system-ui, -apple-system, sans-serif; -webkit-font-smoothing:antialiased; }
  main { padding:14px 16px 16px; }
  .brand { font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); font-weight:500; margin:0; }
  h1 { font-size:17px; font-weight:500; letter-spacing:0; margin:6px 0 0; display:flex; align-items:center; gap:8px; }
  h1 svg { width:20px; height:20px; flex:none; }
  p { margin:6px 0 0; color:var(--soft); }
  .good { color:var(--good); } .note { color:var(--note); }
  .btn { all:unset; cursor:pointer; display:inline-flex; align-items:center; height:34px; padding:0 14px; margin-top:12px; background:var(--btn); color:var(--on); font-weight:500; }
  .btn:focus-visible { outline:2px solid var(--note); outline-offset:2px; }
  .spin { width:16px; height:16px; border-radius:50%; border:2px solid var(--line); border-top-color:var(--btn); animation:t .8s linear infinite; flex:none; }
  @keyframes t { to { transform:rotate(360deg); } }
  details { margin-top:16px; border-top:1px solid var(--line); padding-top:10px; }
  summary { cursor:pointer; color:var(--soft); font-size:12px; }
  label { display:block; margin-top:8px; font-size:12px; color:var(--soft); }
  input { width:100%; margin-top:4px; height:32px; padding:0 8px; border:1px solid var(--line); background:transparent; color:var(--ink); font:inherit; }
  .small { font-size:11.5px; }
</style>
</head>
<body>
<main>
  <p class="brand">TLE OS for Propoly</p>
  <div id="status"><h1><span class="spin" aria-hidden="true"></span>Checking</h1></div>
  <details>
    <summary>For testing</summary>
    <label for="origin">TLE OS address</label>
    <input id="origin" type="url" placeholder="https://tle-os.co.uk" spellcheck="false">
    <p class="small">Leave blank for the live TLE OS.</p>
  </details>
</main>
<script src="popup.js"></script>
</body>
</html>
