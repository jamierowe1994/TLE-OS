<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TLE Landlord File</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Layout: the landlord's own file. A light header with the agent always one tap away, four views
   (Overview, Documents, Messages, Journey) in one page, and the letting plan as a page-turn booklet
   that opens over everything. TLE OS tokens: white, greys, sage, manilla, oat, coral, ink.
   Single light look by choice, to match the presentations the landlord has already seen. */
:root {
  --paper: #ffffff; --grey: #f6f6f5; --well: #f0f0ee; --ink: #141413; --muted: #63625b; --faint: #8f8e87;
  --line: rgba(20, 20, 19, .1); --line-2: rgba(20, 20, 19, .2);
  --coral: #eb8c6d; --clay: #aa4a2b; --sage: #66785b; --sage-soft: #e3e3d3; --manilla: #f5e3c7; --oat: #e3dacc; --forest: #2e3829;
  --f-title: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --f-ui: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease: cubic-bezier(.16, 1, .3, 1);
  --r: 22px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--coral); outline-offset: 3px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }
.lab { font-size: 13px; color: var(--muted); }
.title { font-family: var(--f-title); font-weight: 300; letter-spacing: -.035em; line-height: 1.02; margin: 0; text-wrap: balance; }
.title .soft { color: var(--faint); }
.eyebrow { font-size: 14px; margin: 0 0 12px; }
.ic { width: 18px; height: 18px; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; padding: 5px 11px; border-radius: 999px; background: var(--well); white-space: nowrap; }
.pill.sage { background: var(--sage-soft); color: #4d5e43; } .pill.on { background: var(--ink); color: #fff; } .pill.man { background: var(--manilla); color: var(--clay); } .pill.w { background: var(--paper); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; border-radius: 14px; padding: 13px 20px; font-size: 14.5px; cursor: pointer; border: 1px solid var(--line-2); background: transparent; text-decoration: none; transition: background .3s var(--ease), border-color .3s, color .3s, gap .35s var(--ease); white-space: nowrap; }
.btn.primary { background: var(--coral); border-color: var(--coral); color: var(--ink); font-weight: 500; }
.btn.primary:hover { background: var(--clay); border-color: var(--clay); color: #fff; gap: 13px; }
.btn:not(.primary):hover { background: var(--sage); border-color: var(--sage); color: #fff; }
.btn.sm { padding: 9px 14px; font-size: 13px; border-radius: 11px; }
.btn .ic { width: 16px; height: 16px; }
.card { background: var(--grey); border-radius: var(--r); padding: 24px; min-width: 0; }
.card h3 { font-family: var(--f-title); font-weight: 400; font-size: 20px; letter-spacing: -.02em; margin: 0; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.av { width: 40px; height: 40px; border-radius: 50%; background: var(--sage-soft); color: #4d5e43; display: grid; place-items: center; font-family: var(--f-title); font-size: 15px; flex: none; }
.av.lg { width: 64px; height: 64px; font-size: 22px; }
.sample { position: fixed; z-index: 30; right: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--faint); background: var(--paper); border: 1px solid var(--line); padding: 5px 10px; border-radius: 999px; }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255, 255, 255, .92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--paper); }
.top .wrap { display: flex; align-items: center; gap: 28px; height: 68px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 500; font-size: 14px; text-decoration: none; }
.brand svg { width: 26px; height: 26px; }
.tabs { display: flex; gap: 4px; margin-left: 12px; }
.tabs a { text-decoration: none; font-size: 14px; color: var(--muted); padding: 8px 14px; border-radius: 999px; transition: background .25s, color .25s; }
.tabs a:hover { color: var(--ink); background: var(--grey); }
.tabs a.on { color: var(--ink); background: var(--well); font-weight: 500; }
.tabs a b { font-weight: 500; font-size: 11px; background: var(--coral); color: var(--ink); border-radius: 999px; padding: 1px 6px; margin-left: 6px; }
.agent-chip { margin-left: auto; position: relative; }
.agent-chip > button { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 14px 5px 5px; cursor: pointer; }
.agent-chip > button .av { width: 32px; height: 32px; font-size: 12px; }
.agent-chip > button > span:not(.av) { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
.agent-chip > button b { font-weight: 500; font-size: 13px; } .agent-chip > button small { font-size: 11.5px; color: var(--muted); }
.menu { position: absolute; right: 0; top: calc(100% + 8px); width: 280px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 8px; display: none; box-shadow: 0 18px 40px rgba(20, 20, 19, .1); z-index: 50; }
.menu.open { display: block; animation: pop .25s var(--ease); }
.menu a, .menu button { display: flex; align-items: center; gap: 12px; width: 100%; text-decoration: none; padding: 11px 12px; border-radius: 12px; border: 0; background: none; cursor: pointer; text-align: left; font-size: 14px; }
.menu a:hover, .menu button:hover { background: var(--grey); }
.menu .lab { display: block; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }

/* ---------- views ---------- */
.view { display: none; padding-top: 44px; padding-bottom: 80px; }
.view.on { display: block; animation: rise .6s var(--ease); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); filter: blur(3px); } }
.vhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 32px; flex-wrap: wrap; }
.vhead .title { font-size: clamp(36px, 5vw, 58px); }
.vhead .lead { color: var(--muted); max-width: 30em; margin: 12px 0 0; font-size: 16px; }

/* overview */
.hero { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: stretch; }
.hero-l { display: flex; flex-direction: column; justify-content: space-between; gap: 28px; padding: 8px 0; }
.hero-l .title { font-size: clamp(42px, 6vw, 76px); }

.prop svg.door-art { position: absolute; inset: 0; width: 100%; height: 100%; }
.next { background: var(--grey); color: var(--ink); border-radius: var(--r); padding: 24px 26px; display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; }
.next .lab { color: var(--muted); }
.next b { display: block; font-family: var(--f-title); font-weight: 400; font-size: 22px; letter-spacing: -.02em; }
.next-ic { width: 46px; height: 46px; border-radius: 50%; background: var(--coral); color: var(--ink); display: grid; place-items: center; }
.prop { position: relative; border-radius: var(--r); overflow: hidden; min-height: 380px; background: linear-gradient(165deg, #3b4735, var(--forest) 70%); color: #faf9f5; display: flex; flex-direction: column; justify-content: space-between; }
.prop svg.house { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 78%; }
.prop .sun { fill: var(--coral); } .prop .ln { fill: none; stroke: #faf9f5; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; } .prop .body { fill: var(--forest); } .prop .win { fill: var(--manilla); opacity: .85; } .prop .door { fill: var(--coral); }
.prop-top { position: relative; padding: 20px 22px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.glass { background: rgba(255, 255, 255, .14); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: #fff; }
.prop-foot { position: relative; margin: 16px; padding: 16px 18px; border-radius: 16px; background: var(--paper); color: var(--ink); display: grid; grid-template-columns: 1fr auto; gap: 8px 18px; align-items: end; }
.prop-foot b { display: block; font-family: var(--f-title); font-weight: 400; font-size: 21px; letter-spacing: -.02em; }
.prop-foot .rent { font-family: var(--f-title); font-weight: 300; font-size: 30px; letter-spacing: -.03em; text-align: right; line-height: 1; }
.prop-foot .rent sup { font-size: 12px; color: var(--muted); margin-left: 2px; }
.grid3 { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 20px; margin-top: 20px; }
/* the booklet card */
.bookcard { position: relative; background: var(--sage-soft); border-radius: var(--r); padding: 26px; display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; overflow: hidden; cursor: pointer; border: 0; text-align: left; }
.bookcard h3 { font-family: var(--f-title); font-weight: 300; font-size: 30px; letter-spacing: -.03em; margin: 6px 0 8px; }
.bookcard p { margin: 0 0 18px; color: #4d5e43; max-width: 22em; }
.mini-book { position: relative; width: 150px; height: 186px; perspective: 800px; }
.mini-book > span { position: absolute; inset: 0; border-radius: 4px 10px 10px 4px; }
.mini-book .pg1 { background: #fff; transform: translate(10px, 6px) rotate(4deg); box-shadow: 0 6px 18px rgba(20, 20, 19, .08); }
.mini-book .pg2 { background: var(--manilla); transform: translate(5px, 3px) rotate(2deg); }
.mini-book .cv { background: var(--paper); box-shadow: 0 10px 26px rgba(20, 20, 19, .14), inset 6px 0 0 var(--well); transform-origin: left center; transition: transform .8s var(--ease); padding: 16px 14px 14px 20px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
.bookcard:hover .mini-book .cv { transform: rotateY(-22deg); }
.mini-book .cv b { font-family: var(--f-title); font-weight: 300; font-size: 19px; line-height: 1; letter-spacing: -.03em; }
.mini-book .cv svg { width: 100%; height: 70px; }
.ring { position: relative; width: 108px; height: 108px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 9; } .ring .bg { stroke: var(--paper); } .ring .fg { stroke: var(--sage); stroke-linecap: round; transition: stroke-dashoffset 1.2s var(--ease); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-title); font-weight: 300; font-size: 30px; letter-spacing: -.03em; }
.readiness { display: flex; flex-direction: column; justify-content: space-between; gap: 16px; }
.ready-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ready-list li { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.ready-list li i { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; }
.ready-list li.done i { background: var(--sage); border-color: var(--sage); color: #fff; } .ready-list li.done { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line-2); }
.ready-list li.now i { border-color: var(--coral); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 10px var(--coral); }
.ready-list svg { width: 12px; height: 12px; stroke-width: 2.6; }
.docs-mini .bar { display: block; height: 6px; border-radius: 999px; background: var(--paper); margin: 14px 0 16px; overflow: hidden; } .docs-mini .bar i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
.docs-mini ul { list-style: none; margin: 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.docs-mini li { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; }
/* journey strip */
.journey { margin-top: 20px; padding: 26px 28px 30px; border: 1px solid var(--line); border-radius: var(--r); }
.steps7 { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-top: 26px; }
.steps7::before { content: ""; position: absolute; left: 7px; right: 7px; top: 7px; height: 2px; background: var(--well); }
.steps7 .fill { position: absolute; left: 7px; top: 7px; height: 2px; background: var(--ink); }
.s7 { position: relative; padding-top: 28px; display: flex; flex-direction: column; gap: 4px; }
.s7::before { content: ""; position: absolute; top: 0; left: 0; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line-2); }
.s7.done::before { background: var(--ink); border-color: var(--ink); } .s7.now::before { background: var(--coral); border-color: var(--coral); box-shadow: 0 0 0 6px rgba(235, 140, 109, .2); }
.s7 b { font-weight: 500; font-size: 14px; } .s7.up b { color: var(--muted); font-weight: 400; }
.fees { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-top: 20px; border-radius: var(--r); background: var(--grey); }
.fees > div { padding: 22px 24px; display: flex; flex-direction: column; gap: 6px; } .fees > div + div { border-left: 1px solid var(--line); }
.fees b { font-family: var(--f-title); font-weight: 300; font-size: 26px; letter-spacing: -.03em; }
.afterlet { margin-top: 20px; display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; align-items: center; background: var(--ink); color: #fff; border-radius: var(--r); padding: 30px 32px; }
.afterlet .lab { color: rgba(255, 255, 255, .6); }
.afterlet .title { font-size: 34px; }
.al-items { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.al-items div { background: #23231f; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 22px; }
.al-items b { font-weight: 500; font-size: 14px; }

/* documents */
.docs-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; align-items: start; }
.dlist { list-style: none; margin: 0; padding: 0; }
.dlist li { display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; padding: 16px 0; border-top: 1px solid var(--line); }
.dlist li:first-child { border-top: 0; }
.dic { width: 40px; height: 40px; border-radius: 12px; background: var(--paper); display: grid; place-items: center; }
.dlist li.got .dic { background: var(--sage-soft); color: #4d5e43; }
.dlist b { display: block; font-weight: 500; font-size: 15px; }
.upl { position: relative; overflow: hidden; } .upl input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 34px 0 10px; } .sec-h:first-child { margin-top: 0; }
.sec-h h2 { font-family: var(--f-title); font-weight: 400; font-size: 22px; letter-spacing: -.02em; margin: 0; }
.drop { margin-top: 14px; display: flex; align-items: center; gap: 14px; padding: 18px 20px; border: 1.5px dashed var(--line-2); border-radius: 18px; color: var(--muted); cursor: pointer; transition: border-color .25s, background .25s; position: relative; }
.drop:hover, .drop.over { border-color: var(--sage); background: var(--sage-soft); color: var(--ink); }
.drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.side-stack { display: flex; flex-direction: column; gap: 20px; }
/* messages */
.msg-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; align-items: start; }
.thread { border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.day { align-self: center; font-size: 12px; color: var(--faint); }
.bub { max-width: 78%; display: flex; flex-direction: column; gap: 4px; }
.bub p { margin: 0; padding: 12px 15px; border-radius: 18px; font-size: 14.5px; }
.bub.me { align-self: flex-end; align-items: flex-end; } .bub.me p { background: var(--ink); color: #fff; border-bottom-right-radius: 6px; }
.bub.them p { background: var(--grey); border-bottom-left-radius: 6px; }
.bub small { font-size: 11.5px; color: var(--faint); }
.compose { display: flex; gap: 10px; align-items: flex-end; margin-top: 8px; padding-top: 16px; border-top: 1px solid var(--line); }
.compose textarea { flex: 1; min-width: 0; resize: none; font: inherit; font-size: 15px; border: 1px solid var(--line-2); border-radius: 16px; padding: 12px 14px; min-height: 48px; }
.compose textarea:focus { outline: none; border-color: var(--sage); }
/* journey view */
.jlist { list-style: none; margin: 0; padding: 0; position: relative; }
.jlist::before { content: ""; position: absolute; left: 19px; top: 10px; bottom: 10px; width: 2px; background: var(--well); }
.jl { position: relative; display: grid; grid-template-columns: 40px 1fr; gap: 18px; padding: 0 0 18px; }
.jl-dot { position: relative; z-index: 1; width: 40px; height: 40px; border-radius: 50%; background: var(--paper); border: 2px solid var(--line-2); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.jl.done .jl-dot { background: var(--ink); border-color: var(--ink); color: #fff; } .jl.now .jl-dot { background: var(--coral); border-color: var(--coral); color: var(--ink); }
.jl-card { border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
.jl.now .jl-card { background: var(--grey); border-color: transparent; }
.jl-card h4 { margin: 0; font-family: var(--f-title); font-weight: 400; font-size: 19px; letter-spacing: -.02em; }
.roles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.roles div { background: var(--paper); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; } .jl:not(.now) .roles div { background: var(--grey); }
.roles span { display: block; font-size: 11.5px; color: var(--faint); margin-bottom: 2px; }
.foot { border-top: 1px solid var(--line); padding: 26px 0 40px; }
.foot .wrap { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.foot nav { display: flex; gap: 18px; flex-wrap: wrap; } .foot a { text-decoration: none; } .foot a:hover { color: var(--ink); }

/* ================== the booklet ================== */
.bk { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; visibility: hidden; opacity: 0; transition: opacity .45s var(--ease), visibility 0s .45s; }
.bk.open { visibility: visible; opacity: 1; transition: opacity .45s var(--ease); }
.bk-scrim { position: absolute; inset: 0; background: rgba(20, 20, 19, .56); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.bk-x { position: absolute; z-index: 5; top: calc(18px + env(safe-area-inset-top, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--paper); display: grid; place-items: center; cursor: pointer; }
.bk-contact { position: absolute; z-index: 5; top: calc(18px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); }
.bk-contact > button { display: flex; align-items: center; gap: 8px; border: 0; background: var(--paper); border-radius: 999px; padding: 10px 16px 10px 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
.bk-contact .av { width: 28px; height: 28px; font-size: 11px; }
.bk-contact .menu { left: 50%; right: auto; transform: translateX(-50%); }
.bk-contact .menu.open { animation: none; }
.bk-stage { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 22px; }
.book { position: relative; width: var(--bw); height: var(--bh); perspective: 3000px; transition: transform .9s var(--ease); }
.book.closed { transform: translateX(-25%); } .book.ended { transform: translateX(25%); }
.leaf { position: absolute; top: 0; left: 50%; width: 50%; height: 100%; transform-style: preserve-3d; transform-origin: left center; transition: transform 1s cubic-bezier(.3, .1, .2, 1); }
.leaf.flipped { transform: rotateY(-180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; background: #fbfbfa; }
.face.back { transform: rotateY(180deg); }
/* swap which side is showing at the halfway point of a turn, so nothing bleeds through */
.face { transition: visibility 0s linear .38s; }
.leaf .face.back, .leaf.flipped .face.front { visibility: hidden; }
.leaf.flipped .face.back { visibility: inherit; }
.face.front { border-radius: 0 6px 6px 0; box-shadow: 1px 0 0 #dddcd7, 2px 1px 0 #f7f7f4, 3px 1px 0 #d7d6d0, 4px 2px 0 #f3f3f0, 5px 2px 0 #cfcec8; }
.face.back { border-radius: 6px 0 0 6px; box-shadow: -1px 0 0 #dddcd7, -2px 1px 0 #f7f7f4, -3px 1px 0 #d7d6d0, -4px 2px 0 #f3f3f0, -5px 2px 0 #cfcec8; }
.face.cover-f { border-radius: 4px 8px 8px 4px; box-shadow: inset 10px 0 0 #eeeeec, inset 12px 0 0 #e0e0dc; }
.book::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: rgba(20, 20, 19, .06); pointer-events: none; z-index: 200; opacity: 0; transition: opacity .4s; }
.book:not(.closed):not(.ended)::after { opacity: 1; }
.book::after { background: linear-gradient(90deg, rgba(20, 20, 19, .1), rgba(20, 20, 19, .3) 50%, rgba(20, 20, 19, .1)); width: 3px; margin-left: -1.5px; }
.bk-shadow { position: absolute; left: 4%; right: 4%; bottom: -18px; height: 30px; background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, .35), transparent); filter: blur(8px); z-index: -1; }
.bk-bar { display: flex; align-items: center; justify-content: space-between; gap: 18px; width: var(--bw); max-width: 100%; }
.bk-bar .btn.primary { box-shadow: 0 6px 20px rgba(0, 0, 0, .12); }
.bk-nav { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 13px; }
.bk-nav button { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--paper); color: var(--ink); display: grid; place-items: center; cursor: pointer; transition: opacity .25s, transform .3s var(--ease); }
.bk-nav button:hover:not(:disabled) { transform: scale(1.06); } .bk-nav button:disabled { opacity: .4; cursor: default; }
.bk-dots { display: flex; gap: 4px; margin-right: 8px; } .bk-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .35); transition: width .3s var(--ease), background .3s; } .bk-dots i.on { width: 18px; border-radius: 999px; background: #fff; }

/* ============ The Plan: a little magazine about one house ============
   Every size is in --p (1% of the page width). A page is 100p wide, 125p tall. */
.book { --t-s: max(10px, calc(var(--p) * 1.55)); --t-m: max(11.5px, calc(var(--p) * 1.9)); --t-b: max(13px, calc(var(--p) * 2.2)); }
.face::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 20; }
.face.front::after { background: linear-gradient(90deg, rgba(20, 20, 19, .28), rgba(20, 20, 19, 0) 70%); }
.face.back::after { background: linear-gradient(270deg, rgba(20, 20, 19, .28), rgba(20, 20, 19, 0) 70%); }
.leaf.turning .face::after { animation: zshade 1s ease-in-out; }
@keyframes zshade { 0% { opacity: 0; } 45% { opacity: 1; } 100% { opacity: 0; } }
.face.front:not(.cover-f)::before { content: ""; position: absolute; right: 0; bottom: 0; width: calc(var(--p) * 4.4); height: calc(var(--p) * 4.4); background: linear-gradient(135deg, transparent 50%, rgba(20, 20, 19, .07) 50%, #e8e8e4 62%, #f3f3f0); border-top-left-radius: calc(var(--p) * 1); z-index: 21; transition: width .35s var(--ease), height .35s var(--ease); }
.book:hover .face.front:not(.cover-f)::before { width: calc(var(--p) * 6.4); height: calc(var(--p) * 6.4); }

.zp:not(.zcov):not(.zback)::before { content: ""; position: absolute; top: 0; bottom: 0; width: calc(var(--p) * 11); pointer-events: none; z-index: 15; }
.face.front .zp::before { left: 0; background: linear-gradient(90deg, rgba(20, 20, 19, .2), rgba(20, 20, 19, .07) 18%, rgba(20, 20, 19, .02) 55%, rgba(20, 20, 19, 0)); }
.face.back .zp::before { right: 0; background: linear-gradient(270deg, rgba(20, 20, 19, .2), rgba(20, 20, 19, .07) 18%, rgba(20, 20, 19, .02) 55%, rgba(20, 20, 19, 0)); }
.zp { position: absolute; inset: 0; padding: calc(var(--p) * 8) calc(var(--p) * 8) calc(var(--p) * 10); display: flex; flex-direction: column; background: var(--bg, #fff); color: var(--ink); font-size: var(--t-b); line-height: 1.5; overflow: hidden; }
.zp.sage { --bg: var(--sage-soft); } .zp.man { --bg: var(--manilla); } .zp.oat { --bg: var(--oat); } .zp.grey { --bg: var(--grey); } .zp.coral { --bg: var(--coral); } .zp.ink { --bg: var(--ink); color: #faf9f5; } .zp.forest { --bg: var(--forest); color: #faf9f5; }
.zk { font-family: var(--f-mono); font-size: var(--t-s); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: calc(var(--p) * 1.2); }
.zk b { font-weight: 400; color: var(--clay); }
.zp.ink .zk, .zp.forest .zk { color: rgba(250, 249, 245, .6); } .zp.ink .zk b, .zp.forest .zk b, .zp.coral .zk b { color: inherit; } .zp.coral .zk { color: rgba(20, 20, 19, .62); }
.zh { font-family: var(--f-title); font-weight: 300; font-size: max(30px, calc(var(--p) * 9)); line-height: .94; letter-spacing: -.045em; margin: calc(var(--p) * 2.4) 0 0; text-wrap: balance; }
.zh .soft { color: var(--faint); } .zp.ink .zh .soft, .zp.forest .zh .soft { color: rgba(250, 249, 245, .5); } .zp.coral .zh .soft { color: rgba(20, 20, 19, .5); }
.hl { background: linear-gradient(transparent 60%, var(--hl, var(--manilla)) 60% 90%, transparent 90%); padding: 0 .06em; margin: 0 -.06em; }
.zb { color: var(--muted); max-width: 32em; margin: calc(var(--p) * 2.6) 0 0; }
.zp.ink .zb, .zp.forest .zb { color: rgba(250, 249, 245, .72); } .zp.coral .zb { color: rgba(20, 20, 19, .72); }
.zf { position: absolute; left: calc(var(--p) * 8); right: calc(var(--p) * 8); bottom: calc(var(--p) * 4.2); display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: var(--t-s); color: var(--faint); letter-spacing: .06em; }
.face.back .zf { flex-direction: row-reverse; }
.zp.ink .zf, .zp.forest .zf { color: rgba(250, 249, 245, .42); } .zp.coral .zf { color: rgba(20, 20, 19, .5); }
.auto { margin-top: auto; }
.scrib { position: absolute; pointer-events: none; overflow: visible; }
.scrib path { fill: none; stroke: var(--clay); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hand { font-family: var(--f-title); font-weight: 400; color: var(--clay); font-size: var(--t-m); letter-spacing: -.01em; transform: rotate(-4deg); display: inline-block; }

/* stickers */
.stk { position: absolute; display: grid; place-items: center; text-align: center; border-radius: 50%; width: calc(var(--p) * 17); aspect-ratio: 1; background: var(--coral); color: var(--ink); font-family: var(--f-title); font-weight: 500; font-size: max(11px, calc(var(--p) * 2)); line-height: 1.05; letter-spacing: -.02em; transform: rotate(var(--r, 12deg)); box-shadow: 0 calc(var(--p) * .6) calc(var(--p) * 1.6) rgba(20, 20, 19, .14); z-index: 4; transition: transform .5s var(--ease); }
.stk::before { content: ""; position: absolute; inset: calc(var(--p) * 1); border: 1.5px dashed currentColor; border-radius: 50%; opacity: .45; }
.stk small { display: block; font-family: var(--f-mono); font-weight: 400; font-size: var(--t-s); letter-spacing: .1em; text-transform: uppercase; margin-bottom: calc(var(--p) * .4); }
.book:hover .stk { transform: rotate(calc(var(--r, 12deg) - 6deg)) scale(1.03); }
.tape { position: relative; }
.tape::before { content: ""; position: absolute; top: calc(var(--p) * -1.8); left: 50%; width: calc(var(--p) * 14); height: calc(var(--p) * 3.6); transform: translateX(-50%) rotate(var(--tr, -3deg)); background: rgba(245, 227, 199, .82); box-shadow: 0 1px 2px rgba(20, 20, 19, .06); z-index: 3; }

/* cover */
.zcov { --bg: var(--sage-soft); padding: calc(var(--p) * 6.5) calc(var(--p) * 7) calc(var(--p) * 6); }
.zcov-top { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: var(--t-s); letter-spacing: .1em; text-transform: uppercase; color: #4d5e43; border-bottom: 1.5px solid var(--ink); padding-bottom: calc(var(--p) * 1.4); }
.mast { font-family: var(--f-title); font-weight: 500; font-size: max(64px, calc(var(--p) * 25)); line-height: .8; letter-spacing: -.07em; margin: calc(var(--p) * 3.2) 0 0 calc(var(--p) * -.8); }
.mast span { color: var(--clay); }
.zcov-sub { display: flex; justify-content: space-between; align-items: baseline; margin-top: calc(var(--p) * 1.6); font-size: var(--t-m); }
.zcov-sub b { font-weight: 500; }
.zcov-art { position: relative; flex: 1; min-height: calc(var(--p) * 40); }
.zcov-art svg.key { position: absolute; left: 0; bottom: calc(var(--p) * -2); width: 86%; height: auto; }
.lines { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--p) * 2.4); margin-top: calc(var(--p) * 3); padding-top: calc(var(--p) * 1.6); border-top: 1px solid rgba(20, 20, 19, .18); }
.lines div { font-family: var(--f-title); font-size: var(--t-m); line-height: 1.15; letter-spacing: -.01em; }
.lines div b { display: block; font-family: var(--f-mono); font-weight: 400; font-size: var(--t-s); color: var(--clay); letter-spacing: .08em; margin-bottom: calc(var(--p) * .3); }
.zcov-foot { display: flex; justify-content: space-between; align-items: flex-end; gap: calc(var(--p) * 3); border-top: 1.5px solid var(--ink); padding-top: calc(var(--p) * 1.8); }
.zcov-foot .who { font-size: var(--t-s); color: #4d5e43; line-height: 1.45; } .zcov-foot .who b { display: block; color: var(--ink); font-weight: 500; font-size: var(--t-m); }
.barcode { display: flex; flex-direction: column; align-items: center; gap: calc(var(--p) * .5); background: #fff; padding: calc(var(--p) * 1) calc(var(--p) * 1.4) calc(var(--p) * .7); border-radius: calc(var(--p) * .6); }
.barcode svg { width: calc(var(--p) * 17); height: calc(var(--p) * 5.2); display: block; }
.barcode span { font-family: var(--f-mono); font-size: var(--t-s); letter-spacing: .2em; }

/* contents */
.toc { list-style: none; margin: calc(var(--p) * 4.5) 0 0; padding: 0; display: flex; flex-direction: column; }
.toc button { all: unset; box-sizing: border-box; cursor: pointer; width: 100%; display: grid; grid-template-columns: calc(var(--p) * 13) 1fr auto; align-items: baseline; gap: calc(var(--p) * 1); padding: calc(var(--p) * 1.55) 0; border-top: 1px solid var(--line); transition: padding .4s var(--ease); }
.toc li:last-child button { border-bottom: 1px solid var(--line); }
.toc .n { font-family: var(--f-title); font-weight: 300; font-size: max(22px, calc(var(--p) * 5.4)); line-height: .9; letter-spacing: -.05em; color: var(--clay); }
.toc b { font-family: var(--f-title); font-weight: 400; font-size: max(15px, calc(var(--p) * 2.9)); letter-spacing: -.025em; line-height: 1.1; display: block; }
.toc span.d { display: block; color: var(--muted); font-size: var(--t-s); margin-top: calc(var(--p) * .4); }
.toc .go { width: calc(var(--p) * 4.4); height: calc(var(--p) * 4.4); border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; transition: background .3s, border-color .3s, transform .4s var(--ease); align-self: center; }
.toc .go svg { width: 45%; height: 45%; }
.toc button:hover { padding-left: calc(var(--p) * 1.4); } .toc button:hover .go { background: var(--coral); border-color: var(--coral); transform: rotate(-45deg); }

/* editor's letter */
.letter { margin-top: calc(var(--p) * 4.4); display: flex; flex-direction: column; gap: calc(var(--p) * 1.8); max-width: 34em; }
.letter p { margin: 0; color: var(--ink); font-family: var(--f-title); font-weight: 300; font-size: max(15px, calc(var(--p) * 2.9)); line-height: 1.3; letter-spacing: -.015em; }
.dear { font-family: var(--f-title); font-weight: 300; font-size: max(30px, calc(var(--p) * 8.4)); letter-spacing: -.045em; line-height: 1; margin: calc(var(--p) * 7) 0 0; }
.sign { display: flex; align-items: flex-end; justify-content: space-between; gap: calc(var(--p) * 2); }
.sign svg { width: calc(var(--p) * 30); height: auto; overflow: visible; }
.sign svg path { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.sign .who { font-size: var(--t-s); color: #6b5d45; margin-top: calc(var(--p) * .4); } .sign .who b { display: block; color: var(--ink); font-weight: 500; font-size: var(--t-m); }
.ps { font-family: var(--f-title); font-size: var(--t-m); line-height: 1.35; padding-top: calc(var(--p) * 2); border-top: 1px dashed rgba(20, 20, 19, .28); }
.ps b { color: var(--clay); font-weight: 500; }

/* trading card */
.tcard-wrap { flex: 1; display: grid; place-items: center; padding-top: calc(var(--p) * 3); }
.tcard { width: calc(var(--p) * 62); background: var(--forest); color: #faf9f5; border-radius: calc(var(--p) * 3.4); padding: calc(var(--p) * 2.2); transform: rotate(-3deg); box-shadow: 0 calc(var(--p) * 2) calc(var(--p) * 5) rgba(20, 20, 19, .22), inset 0 0 0 calc(var(--p) * .6) var(--coral); transition: transform .6s var(--ease); position: relative; }
.book:hover .tcard { transform: rotate(-1deg) translateY(calc(var(--p) * -.6)); }
.tc-head { display: flex; justify-content: space-between; align-items: baseline; padding: calc(var(--p) * .6) calc(var(--p) * 1.2) calc(var(--p) * 1.4); }
.tc-head b { font-family: var(--f-title); font-weight: 500; font-size: max(20px, calc(var(--p) * 5)); letter-spacing: -.04em; line-height: 1; }
.tc-head span { font-family: var(--f-mono); font-size: var(--t-s); color: var(--coral); }
.tc-art { border-radius: calc(var(--p) * 2); overflow: hidden; background: linear-gradient(180deg, #f5e3c7, #e3dacc); }
.tc-art svg { display: block; width: 100%; height: auto; }
.tc-type { display: flex; justify-content: space-between; font-size: var(--t-s); padding: calc(var(--p) * 1.2) calc(var(--p) * 1.2) calc(var(--p) * .6); color: rgba(250, 249, 245, .7); font-style: italic; }
.tc-stats { display: grid; gap: calc(var(--p) * 1); padding: calc(var(--p) * .8) calc(var(--p) * 1.2) calc(var(--p) * 1.2); }
.tc-stats div { display: grid; grid-template-columns: calc(var(--p) * 18) 1fr auto; gap: calc(var(--p) * 1.4); align-items: center; font-size: var(--t-s); }
.tc-stats i { height: calc(var(--p) * 1.1); border-radius: 999px; background: rgba(250, 249, 245, .14); position: relative; overflow: hidden; }
.tc-stats i::after { content: ""; position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--coral); border-radius: inherit; }
.tc-stats b { font-family: var(--f-mono); font-weight: 400; }
.tc-power { margin: calc(var(--p) * .6) calc(var(--p) * 1.2) calc(var(--p) * .6); padding: calc(var(--p) * 1.4) calc(var(--p) * 1.6); border-radius: calc(var(--p) * 1.6); background: rgba(250, 249, 245, .08); font-size: var(--t-s); }
.tc-power b { color: var(--coral); font-weight: 500; }
.tcard .stk { --r: 14deg; right: calc(var(--p) * -6); top: calc(var(--p) * -6); width: calc(var(--p) * 15); }

/* sticky notes */
.notes { position: relative; flex: 1; margin-top: calc(var(--p) * 4); display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--p) * 3); align-content: start; }
.note { background: var(--nbg, var(--manilla)); padding: calc(var(--p) * 2.6) calc(var(--p) * 2.4) calc(var(--p) * 3); min-height: calc(var(--p) * 24); transform: rotate(var(--r, -2deg)); box-shadow: 0 calc(var(--p) * 1) calc(var(--p) * 2) rgba(20, 20, 19, .08); transition: transform .5s var(--ease); }
.note .num { font-family: var(--f-title); font-weight: 300; font-size: max(24px, calc(var(--p) * 6)); line-height: .9; letter-spacing: -.05em; color: var(--clay); }
.note b { display: block; font-family: var(--f-title); font-weight: 400; font-size: max(15px, calc(var(--p) * 2.7)); line-height: 1.1; letter-spacing: -.02em; margin-top: calc(var(--p) * 1.4); }
.note p { margin: calc(var(--p) * .8) 0 0; font-size: var(--t-s); color: #5a5850; line-height: 1.45; }
.book:hover .note:nth-child(odd) { transform: rotate(calc(var(--r) + 1.5deg)); }
.todo { margin-top: calc(var(--p) * 1); background: #fff; border: 1px solid var(--line); border-radius: calc(var(--p) * 1.4); padding: calc(var(--p) * 2) calc(var(--p) * 2.4); font-size: var(--t-s); }
.todo .ttl { font-family: var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--clay); margin-bottom: calc(var(--p) * 1); }
.todo div { display: flex; gap: calc(var(--p) * 1.2); align-items: flex-start; padding: calc(var(--p) * .6) 0; }
.todo i { flex: none; width: calc(var(--p) * 2.2); height: calc(var(--p) * 2.2); min-width: 12px; min-height: 12px; border: 1.5px solid var(--ink); border-radius: calc(var(--p) * .5); margin-top: .15em; }
.todo b { font-weight: 500; color: var(--ink); } .todo span { color: var(--muted); }

/* forecast */
.fc-hero { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: calc(var(--p) * 3); margin-top: calc(var(--p) * 4); }
.sun { width: calc(var(--p) * 30); height: calc(var(--p) * 30); }
.sun .rays { transform-origin: 50% 50%; animation: zspin 40s linear infinite; }
@keyframes zspin { to { transform: rotate(360deg); } }
.temp { font-family: var(--f-title); font-weight: 200; font-size: max(64px, calc(var(--p) * 24)); line-height: .8; letter-spacing: -.07em; }
.temp sup { font-size: .38em; vertical-align: top; margin-left: .04em; color: var(--coral); font-weight: 300; }
.temp + span { display: block; font-size: var(--t-m); color: rgba(250, 249, 245, .7); margin-top: calc(var(--p) * 1.4); }
.fc-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--p) * 1.4); }
.fc-row div { border: 1px solid rgba(250, 249, 245, .16); border-radius: calc(var(--p) * 2); padding: calc(var(--p) * 1.8); display: flex; flex-direction: column; gap: calc(var(--p) * .4); }
.fc-row small { font-family: var(--f-mono); font-size: var(--t-s); letter-spacing: .08em; text-transform: uppercase; color: rgba(250, 249, 245, .5); }
.fc-row b { font-family: var(--f-title); font-weight: 400; font-size: max(15px, calc(var(--p) * 3)); letter-spacing: -.03em; line-height: 1.05; }
.fc-row span { font-size: var(--t-s); color: rgba(250, 249, 245, .6); }
.fc-who { display: flex; flex-wrap: wrap; gap: calc(var(--p) * .8); align-items: center; margin-top: calc(var(--p) * 2.2); font-size: var(--t-s); color: rgba(250, 249, 245, .6); }
.fc-who span { border-radius: 999px; padding: calc(var(--p) * .6) calc(var(--p) * 1.5); background: rgba(250, 249, 245, .1); color: #faf9f5; }

/* rents */
.big-pct { font-family: var(--f-title); font-weight: 300; font-size: max(72px, calc(var(--p) * 27)); line-height: .82; letter-spacing: -.07em; margin-top: calc(var(--p) * 4); background: linear-gradient(100deg, #f3b08f, var(--coral) 40%, var(--clay)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .05em; }
.big-pct + p { margin-top: calc(var(--p) * 1); }
.rchart { margin-top: auto; }
.rchart svg { width: 100%; height: auto; overflow: visible; display: block; }
.rchart .ar { fill: var(--sage-soft); } .rchart .ln { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.rchart .dt { fill: var(--coral); stroke: #fff; stroke-width: 3; } .rchart text { font-family: var(--f-mono); font-size: 11px; fill: var(--faint); } .rchart text.k { fill: var(--ink); font-family: var(--f-title); font-size: 15px; }

/* the neighbours */
.street { margin-top: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: calc(var(--p) * 1.2); align-items: end; padding-bottom: calc(var(--p) * 1); border-bottom: 2px solid var(--ink); position: relative; }
.nb { display: flex; flex-direction: column; align-items: stretch; position: relative; }
.nb .rf { height: calc(var(--p) * 9); background: var(--rf, var(--forest)); clip-path: polygon(50% 0, 100% 100%, 0 100%); margin: 0 calc(var(--p) * -.6); }
.nb .bd { height: var(--h, calc(var(--p) * 17)); background: var(--bd, #fff); position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; gap: calc(var(--p) * 1); padding: calc(var(--p) * 1.6) calc(var(--p) * 1.4) 0; }
.nb .w { height: calc(var(--p) * 5); border-radius: calc(var(--p) * 1.6) calc(var(--p) * 1.6) 2px 2px; background: var(--wn, var(--manilla)); }
.nb .dr { grid-column: 1 / -1; justify-self: center; align-self: end; width: 42%; height: calc(var(--p) * 8.6); border-radius: calc(var(--p) * 2) calc(var(--p) * 2) 0 0; background: var(--dr, var(--ink)); }
.nb.you .bd { --bd: var(--coral); --wn: #fff; --dr: var(--ink); } .nb.you .rf { --rf: var(--clay); }
.nb .you-f { position: absolute; top: calc(var(--p) * -9.5); left: 50%; transform: translateX(-50%) rotate(-6deg); background: var(--ink); color: #fff; font-family: var(--f-title); font-size: var(--t-s); padding: calc(var(--p) * .5) calc(var(--p) * 1.3); border-radius: 999px; white-space: nowrap; }
.tags { display: grid; grid-template-columns: repeat(5, 1fr); gap: calc(var(--p) * 1.2); margin-top: calc(var(--p) * 1); }

  let s = seed, x = 0, out = ''; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;

}

/* Asking rent by bedrooms, nearby (TLE OS: we hold no twelve-month trend, so the chart is the market as it stands). */
function rentChart() {
  const RB = MK ? MK.rentByBed : [], W = 420, H = 200, t = 22, b = 30;
  if (!RB.length) return '';
  const top = Math.max(...RB.map(r => r.rent)) * 1.12, slot = (W - 12) / RB.length, bw = Math.min(56, slot * .56);
  const y = v => t + (top - v) * (H - t - b) / top;

      <div class="stamp" style="left:calc(var(--p)*34);top:calc(var(--p)*42);--r:-6deg;--sc:var(--ink);--sz:calc(var(--p)*26)"><small>Protected</small><b>Deposit</b><i>Gov. scheme</i></div></div>${zf(13)}</div>`,

  /* 14 the board game */ `<div class="zp zroad">${zk(14, 'Getting started')}<h2 class="zh">The road <span class="soft">to move-in.</span></h2><p class="zb">You’re on step ${D.stage + 1} of ${D.journey.length}. Here’s the rest of the way.</p>
    <div class="board">${(() => { const J = D.journey, st = k => k < D.stage ? 'done' : k === D.stage ? 'now' : '', sq = (k, ar) => `<div class="bsq ${st(k)}" style="${k >= 3 && k <= 5 ? `grid-row:2;grid-column:${3 - (k - 3)}` : ''}">${k === D.stage ? PAWN : ''}<span class="no">${k + 1}</span><div><b>${esc(J[k][0])}</b><br><span>${k < D.stage ? 'Done' : k === D.stage ? 'You are here' : esc(J[k][2])}</span></div>${ar ? `<span class="ar ${ar}">${ARROW}</span>` : ''}</div>`;
      return sq(0, 'r') + sq(1, 'r') + sq(2, 'd') + sq(3, 'l') + sq(4, 'l') + sq(5, 'd') + `<div class="bsq fin" style="grid-row:3">${KEYS}<div><b style="font-family:var(--f-title);font-weight:400;font-size:max(16px,calc(var(--p)*3.4));letter-spacing:-.03em">7. ${esc(J[6][0])}</b><br><span>Keys handed over. We look after it from here, month by month.</span></div></div>`; })()}</div>${zf(14)}</div>`,

  /* 15 the voucher */ `<div class="zp">${zk(15, 'Next step')}<h2 class="zh">Ready when you are, <span style="color:var(--clay)">${esc(L.first)}.</span></h2><p class="zb">Sign your management terms and we’ll set up your file straight away.</p>
    <div class="vch"><span class="sc">${SCISSORS}</span><small>Voucher · No. 0001</small><h3>Good for one ${SV ? esc(SV.name.toLowerCase()) : ''} let${SV ? '' : ', done properly'}.</h3>
      <div class="terms"><div><b>To redeem</b>Sign your management terms. It takes two minutes.</div><div><b>Valid</b>Whenever you’re ready. No rush, no pressure.</div></div>
      ${D.signed ? `<span class="zbtn" style="cursor:default">Signed ${ARROW}</span>` : `<button class="zbtn" data-sign data-zsign>Sign your contract ${ARROW}</button>`}</div>
    <div class="still"><div><div class="ttl" style="color:var(--clay)">Then, before the photos</div><ul>${D.docs.map(d => `<li class="${d.file ? 'ok' : ''}">${esc(d.name.replace(/ \(.*\)/, ''))}</li>`).join('')}</ul></div><div class="ag"><b>${esc(A.name)}</b>${[A.phone, A.email].filter(Boolean).map(esc).join('<br>')}</div></div>${zf(15)}</div>`,

  /* 16 back cover */ `<div class="zp zback"><div class="br">${LOGO}The Letting Experts</div>
    <div><h2>That’s<br>the plan<span>.</span></h2><p>See you at move-in, ${esc(L.first)}.</p></div>
    <div class="stk"><span><small>Next issue</small>Your first statement</span></div>
    <div class="ct"><span>${esc([A.name, A.phone].filter(Boolean).join(' · '))}</span><span>People · Homes · Relationships</span><span>thelettingexperts.co.uk</span></div></div>`];
const N = (PAGES.length - 2) / 2;   /* spreads */
const book = $('#book');
book.insertAdjacentHTML('beforeend', Array.from({ length: N + 1 }, (_, i) => `<div class="leaf" data-i="${i}"><div class="face front${i === 0 ? ' cover-f' : ''}">${PAGES[2 * i]}</div><div class="face back${i === N ? ' end-blank' : ''}">${PAGES[2 * i + 1]}</div></div>`).join(''));
const leaves = [...book.querySelectorAll('.leaf')];
let f = 0;
function size() {
  const narrow = matchMedia('(max-width: 760px)').matches;
  if (narrow) { book.style.setProperty('--p', (Math.min(window.innerWidth, 560) - 32) / 100 + 'px'); return; }
  const bw = Math.min(window.innerWidth * .9, (window.innerHeight - 230) * 1.6, 1500), pw = bw / 2;
  book.style.setProperty('--bw', bw + 'px'); book.style.setProperty('--bh', pw * 1.25 + 'px'); book.style.setProperty('--p', pw / 100 + 'px');
  document.querySelector('.bk-bar').style.setProperty('--bw', bw + 'px');
}
function stack() { leaves.forEach((lf, i) => { lf.style.zIndex = i < f ? i + 1 : N + 1 - i + 1; }); }
function paint() {
  leaves.forEach((lf, i) => lf.classList.toggle('flipped', i < f)); stack();
  book.classList.toggle('closed', f === 0); book.classList.toggle('ended', f === N + 1);
  $('#bkCount').textContent = f === 0 ? 'Open the cover' : f === N + 1 ? 'The end' : f + ' of ' + N;
  $('#bkPrev').disabled = f === 0; $('#bkNext').disabled = f === N + 1;
  $('#bkDots').innerHTML = Array.from({ length: N }, (_, k) => `<i class="${k + 1 === f ? 'on' : ''}"></i>`).join('');
  $('#bkSign').innerHTML = D.signed ? 'Contract signed ' + ic('check', 2.4) : 'Sign your contract ' + ic('up');
}
function turn(to) {
  to = Math.max(0, Math.min(N + 1, to)); if (to === f) return;
  const i = to > f ? f : f - 1;
  f = to; paint(); leaves[i].style.zIndex = 300; leaves.forEach(l => l.classList.remove('turning')); void leaves[i].offsetWidth; leaves[i].classList.add('turning'); /* the turning leaf rides on top until it lands */
  clearTimeout(turn.t); turn.t = setTimeout(stack, 1000);
}
$('#bkNext').onclick = () => turn(f + 1); $('#bkPrev').onclick = () => turn(f - 1);
book.addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (g) { e.stopPropagation(); if (matchMedia('(max-width: 760px)').matches) { book.querySelectorAll('.face')[+g.dataset.go * 2 - 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' }); } else turn(+g.dataset.go); return; } if (matchMedia('(max-width: 760px)').matches || e.target.closest('button,a')) return; const r = book.getBoundingClientRect(); turn(e.clientX > r.left + r.width / 2 ? f + 1 : f - 1); });
function openBook() { size(); f = 0; paint(); $('#bk').classList.add('open'); $('#bk').setAttribute('aria-hidden', 'false'); document.body.style.overflow = 'hidden'; }
function closeBook() { $('#bk').classList.remove('open'); $('#bk').setAttribute('aria-hidden', 'true'); document.body.style.overflow = ''; }
document.addEventListener('keydown', e => { if (!$('#bk').classList.contains('open')) return; if (e.key === 'ArrowRight') turn(f + 1); else if (e.key === 'ArrowLeft') turn(f - 1); else if (e.key === 'Escape') closeBook(); });
let tx = null; book.addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true }); book.addEventListener('touchend', e => { if (tx === null || matchMedia('(max-width: 760px)').matches) return; const d = e.changedTouches[0].clientX - tx; if (Math.abs(d) > 50) turn(f + (d < 0 ? 1 : -1)); tx = null; });
window.addEventListener('resize', size);
refresh();
if (location.hash === '#booklet') openBook();
</script>
</body>
</html>
