# Landlord Radar: sweep the NN and MK patch, rescore the prospects, send the digest.
#
# Runs after the lettings capture (06:12 UTC) so the two never race for the
# Homesearch rate limit. Same shape as that job for the same reasons: GitHub
# Actions because Railway cron is the wrong shape for an HTTP endpoint on a
# running service; -f so a 4xx/5xx fails the job; the numbers surfaced in the
# run summary so a green run that swept nothing is visible without the log.
#
# The digest inside the run only goes out when RADAR_DIGEST_TO is set on
# Railway AND Resend sending is unlocked there. Both are James's switches.
# Until then the run reports "no digest went out" and everything else still
# happens. See docs/LANDLORD-RADAR.md.

name: Landlord Radar

on:
  schedule:
    # 06:40 UTC daily, half an hour behind the capture.
    - cron: "40 6 * * *"
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Sweep the patch and rescore
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set on this repository - nothing was swept."
            exit 1
          fi

          # The run answers at once and works in the background: both feeds
          # for the patch take minutes and the edge closes a request at 100s.
          START=$(curl -sS -f -X POST -H "x-cron-key: ${CRON_SECRET}" --max-time 60 \
            "https://tle-os.co.uk/api/radar/run")
          echo "$START"
          RUN_ID=$(echo "$START" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("runId",""))')

          # Poll until that run is finished. Up to 15 minutes.
          for i in $(seq 1 90); do
            sleep 10
            BODY=$(curl -sS -f --max-time 30 "https://tle-os.co.uk/api/radar/run")
            STATUS=$(echo "$BODY" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          r=[x for x in d.get('runs',[]) if str(x.get('id'))==str('$RUN_ID')]
          print(r[0]['status'] if r else 'missing')")
            if [ "$STATUS" = "done" ] || [ "$STATUS" = "failed" ]; then break; fi
          done

          python3 - "$BODY" "$RUN_ID" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          d = json.loads(sys.argv[1])
          run = next((x for x in d.get("runs", []) if str(x.get("id")) == sys.argv[2]), {})
          s = d.get("summary", {})
          print("## Landlord Radar\n")
          print(f"- run {sys.argv[2]}: **{run.get('status')}**")
          print(f"- swept **{run.get('swept', 0)}** district feeds, **{run.get('seen', 0)}** listings seen, **{run.get('new_rows', 0)}** new")
          print(f"- **{run.get('events', 0)}** changes recorded")
          print(f"- **{run.get('active') or 0}** properties flagged, **{run.get('quiet') or 0}** went quiet, **{s.get('newToday', 0)}** new today")
          if run.get("digest"):
              print(f"- digest: {run['digest']}")
          if run.get("skipped"):
              print(f"- :warning: **{run['skipped']}** district feeds skipped (nothing written for them)")
          if run.get("error"):
              print(f"- :x: {run['error']}")
          if run.get("status") != "done":
              sys.exit(1)
          PY
